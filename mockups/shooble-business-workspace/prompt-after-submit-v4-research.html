<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Shooble — 조사 시작 미리보기</title>
  <style>
    :root {
      --ink: #18222d;
      --ink-soft: #52606d;
      --muted: #818c97;
      --line: #e1e6eb;
      --canvas: #f2f4f6;
      --paper: #fff;
      --blue: #2368d6;
      --blue-soft: #edf4ff;
      --font-ui: Inter, Pretendard, "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-doc: Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif;
      --shadow: 0 12px 30px rgba(25, 40, 55, .07), 0 1px 3px rgba(25, 40, 55, .07);
    }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(35, 104, 214, .24); outline-offset: 3px; }
    h1, h2, p { margin: 0; }
    svg { display: block; }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 25px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 830;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #fff;
      background: var(--blue);
      font-size: 10px;
      font-weight: 900;
    }

    .topbar-divider { width: 1px; height: 17px; background: var(--line); }
    .prompt {
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 680;
      letter-spacing: -.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spacer { flex: 1; }

    .writing-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
      white-space: nowrap;
    }
    .writing-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }
    .cancel {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid #d4dce4;
      border-radius: 6px;
      color: var(--ink-soft);
      background: #fff;
      font-size: 11px;
      font-weight: 760;
    }
    .cancel:hover { background: #f8fafc; }

    .workspace {
      min-height: calc(100vh - 56px);
      padding: 22px 24px 44px;
    }
    .stack { width: min(100%, 820px); margin: 0 auto; }

    .research-line {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 3px;
      color: var(--ink-soft);
      font-size: 11px;
    }
    .research-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border: 2px solid var(--blue);
      border-radius: 50%;
      background: var(--canvas);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }
    .research-line strong { color: var(--ink); font-weight: 790; white-space: nowrap; }
    .research-copy { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .search-query { color: var(--muted); font-weight: 650; }

    .details-button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      margin-left: auto;
      padding: 3px 0 3px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      font-weight: 730;
    }
    .details-button:hover { color: var(--ink-soft); }
    .details-button svg { width: 12px; height: 12px; transition: transform 180ms ease; }
    .details-button[aria-expanded="true"] svg { transform: rotate(180deg); }

    .details {
      display: none;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin: 0 0 9px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink-soft);
      font-size: 10px;
    }
    .details.open { display: grid; }
    .details-label { color: var(--muted); font-weight: 780; }
    .details-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .details-value strong { color: var(--ink); font-weight: 750; }
    .details-state { color: var(--blue); font-weight: 750; }

    .paper {
      min-height: 760px;
      padding: 49px 77px 75px;
      border: 1px solid #e5e9ed;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .paper-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 720;
    }
    .paper-header strong { color: var(--ink-soft); font-weight: 780; }

    .empty-state {
      max-width: 390px;
      margin: 107px auto 0;
      text-align: center;
    }
    .empty-marker {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid #cbdcff;
      border-radius: 50%;
      color: var(--blue);
      background: var(--blue-soft);
    }
    .empty-marker::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 2px solid currentColor;
      border-radius: 50%;
    }
    .empty-state h1 {
      margin-bottom: 10px;
      color: var(--ink);
      font-family: var(--font-doc);
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -.055em;
    }
    .empty-state p {
      color: var(--muted);
      font-family: var(--font-doc);
      font-size: 14px;
      letter-spacing: -.025em;
      line-height: 1.7;
    }
    .empty-query {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 22px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink-soft);
      background: #fafbfc;
      font-size: 10px;
      font-weight: 730;
    }
    .empty-query::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--blue);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
    @media (max-width: 720px) {
      .topbar { gap: 11px; padding: 0 14px; }
      .topbar-divider, .prompt, .writing-status { display: none; }
      .workspace { padding: 13px 12px 28px; }
      .research-line { min-height: 45px; gap: 8px; }
      .research-copy { line-height: 1.35; }
      .search-query { display: block; }
      .paper { min-height: 700px; padding: 40px 27px 57px; }
      .paper-header span { display: none; }
      .empty-state { margin-top: 95px; }
      .details { grid-template-columns: 45px minmax(0, 1fr); }
      .details-state { grid-column: 2; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><span>슈블</span></div>
    <span class="topbar-divider" aria-hidden="true"></span>
    <span class="prompt">세바사 홍보 글 써줘</span>
    <span class="spacer"></span>
    <span class="writing-status">작성 중</span>
    <button class="cancel" type="button">취소</button>
  </header>

  <main class="workspace">
    <div class="stack">
      <section class="research-line" aria-label="현재 조사 상태" aria-live="polite">
        <span class="research-dot" aria-hidden="true"></span>
        <strong>자료 확인 중</strong>
        <span class="research-copy">검색어 <span class="search-query">세바사 공식 제품 서비스</span></span>
        <button class="details-button" id="detailsButton" type="button" aria-expanded="false" aria-controls="details">
          상세
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </section>

      <div class="details" id="details" aria-hidden="true">
        <span class="details-label">검색</span>
        <span class="details-value"><strong>세바사 공식 제품 서비스</strong></span>
        <span class="details-state">진행 중</span>
        <span class="details-label">페이지</span>
        <span class="details-value">아직 확인된 공개 페이지가 없습니다</span>
        <span class="details-state">대기</span>
      </div>

      <article class="paper" aria-label="읽기 전용 원고 미리보기">
        <div class="paper-header">
          <strong>원고 미리보기</strong>
          <span>읽기 전용 · 첫 원고 조각 대기 중</span>
        </div>

        <div class="empty-state">
          <span class="empty-marker" aria-hidden="true"></span>
          <h1>확인된 자료를 바탕으로 원고를 준비하고 있습니다</h1>
          <p>첫 번째 원고 조각이 도착하면 이 위치에 표시됩니다.</p>
          <span class="empty-query">세바사 공식 제품 서비스 확인 중</span>
        </div>
      </article>
    </div>
  </main>

  <script>
    const detailsButton = document.querySelector('#detailsButton');
    const details = document.querySelector('#details');

    detailsButton.addEventListener('click', () => {
      const isOpen = details.classList.toggle('open');
      detailsButton.setAttribute('aria-expanded', String(isOpen));
      details.setAttribute('aria-hidden', String(!isOpen));
      detailsButton.childNodes[0].textContent = isOpen ? '접기 ' : '상세 ';
    });
  </script>
</body>
</html>
