<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect id="hero-bg" x="0" y="0" width="1440" height="900" fill="#f8fafc"/>
  <g id="hero-content">
    <rect id="hero-card" x="80" y="120" width="560" height="340" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
    <text id="hero-title" x="120" y="210" font-family="Inter" font-size="44px" fill="#0f172a">Launch your idea</text>
    <text id="hero-subtitle" x="120" y="260" font-family="Open Sans" font-size="18px" fill="#475569" text-anchor="middle">Ship faster with open tools</text>
    <path id="hero-badge" d="M120 320 h60 c10 0 20 10 20 20 v30 h-80 z" fill="#1a73e8"/>
    <circle id="hero-dot" cx="140" cy="450" r="24" fill="#e2e8f0"/>
    <ellipse id="hero-ring" cx="200" cy="450" rx="48" ry="24" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text id="hero-lines" x="120" y="500" font-family="Inter" font-size="24px" fill="#334155">Open<tspan dy="28">Design</tspan></text>
    <rect id="hero-gradient-card" x="680" y="120" width="240" height="160" fill="url(#heroGradient)"/>
    <image id="hero-image" x="680" y="320" width="200" height="120" href="https://example.invalid/hero-artwork.png"/>
    <use id="hero-use" href="#hero-dot"/>
  </g>
  <text id="hero-note" x="120" y="560" font-family="Inter" font-size="1.25rem" fill="#64748b">Built with Open Design</text>
  <text id="hero-brand" x="120" y="620" font-family="Acme Display" font-size="32px" fill="#1a73e8">Acme Demo</text>
  <g id="hero-rotated" transform="rotate(15 1000 600)">
    <rect x="1000" y="560" width="120" height="80" fill="#f1f5f9"/>
  </g>
</svg>
