<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>teguma 웹 에디터</title>
    <link rel="stylesheet" href="/web/style.css">
  </head>
  <body>
    <header class="topbar">
      <strong>teguma</strong><span>웹 에디터</span>
      <label>크기 <select id="preset"></select></label>
      <label>조정 <select id="resize-mode"><option value="fill">채우기</option><option value="fit">맞춤</option><option value="original">원본</option><option value="adapt">적응</option></select></label>
      <button id="resize">적용</button>
      <label>내보내기 <select id="export-format"><option>SVG</option><option>PNG</option><option>JPG</option><option>PDF</option><option>PPTX</option><option>GIF</option><option>MP4</option></select></label>
      <button id="export">다운로드</button>
      <span id="status" aria-live="polite"></span>
    </header>
    <main>
      <aside class="sidebar">
        <h2>템플릿</h2>
        <select id="template"></select>
        <p id="template-description"></p>
        <form id="template-slots"></form>
        <button id="instantiate">템플릿으로 시작</button>
        <h2>페이지</h2>
        <nav id="pages" aria-label="페이지"></nav>
        <h2>레이어</h2>
        <nav id="layers" aria-label="레이어"></nav>
      </aside>
      <section class="workspace" aria-label="캔버스 작업 영역">
        <div id="stage" class="stage">
          <img id="artboard" alt="현재 디자인 캔버스">
          <div id="selection" hidden><i data-handle="nw"></i><i data-handle="ne"></i><i data-handle="sw"></i><i data-handle="se"></i></div>
          <textarea id="inline-editor" hidden aria-label="텍스트 편집"></textarea>
        </div>
      </section>
      <aside class="qa-panel">
        <h2>자동 QA</h2>
        <p id="qa-summary"></p>
        <ul id="qa-checks"></ul>
        <p class="hint">선택: 클릭 · 이동: 드래그 · 크기: 모서리 · 텍스트: 두 번 클릭</p>
      </aside>
    </main>
    <script type="module" src="/web/editor.js"></script>
  </body>
</html>
